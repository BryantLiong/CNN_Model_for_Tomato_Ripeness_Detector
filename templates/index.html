<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <h1 class="text-center">Image Classifier</h1>

    <form
      class="p-3 text-center"
      action="/"
      method="post"
      enctype="multipart/form-data"
    >
      <input class="form-control" type="file" name="imagefile" />
      <input class="btn btn-primary mt-3" type="submit" value="Predict Image" />
    </form>

    {% if result %}
    <img
      src="{{ result.image}}"
      class="img-fluid rounded mb-3 d-block mx-auto"
      style="max-height: 300px"
      ,
    />
    <p class="text-center">Hasil Klasifikasi adalah Tomat {{ result.kelas }}</p>
    <p class="text-center">Nilai Kepercayaan adalah {{ result.confidence }}</p>
    {% endif %}
  </body>
</html>
